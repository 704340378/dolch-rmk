# Documentation: https://rmk.rs/docs/configuration.html
[keyboard]
name = "DOLCH-1813"
product_name = "DOLCH-1813"
vendor_id = 0x45D4
product_id = 0x1813
manufacturer = "DH747"
chip = "nrf52840"
usb_enable = true

[storage]
enabled = true
clear_storage = false

[matrix]
# Row and col pins are mandatory
row_pins = ["P0_10", "P0_09", "P1_00", "P0_22", "P0_20", "P0_19"]
col_pins = ["P0_30", "P0_02", "P0_28", "P0_29", "P0_31", "P0_03", "P0_26","P0_04", "P0_21","P0_23", "P0_17","P0_07", "P0_11","P1_08", "P0_27","P0_12", "P0_08","P0_06"]

# RMK uses col2row as the default matrix diode direction, if you want to use a row2col matrix, add `row2col = true`
# row2col = true

[layout]
rows = 6
cols = 18
layers = 4
keymap = [
    [
     ["Escape",  "F1",       "F2",    "F3",    "F4",    "F5",     "F6",    "F7",    "F8",    "F9",    "F10",       "F11",          "F12",           "No" ,         "Insert",     "Home",     "PageUp",      "PrintScreen"  ],
     ["Grave",   "Kc1",      "Kc2",   "Kc3",   "Kc4",   "Kc5",   "Kc6",   "Kc7",   "Kc8",    "Kc9",   "Kc0" ,      "Minus",        "Equal",         "Backspace",   "NumLock",    "KpSlash",  "KpAsterisk",  "Pause"        ],
     ["Tab",     "Q",        "W",     "E",     "R",     "T",     "Y",     "U",     "I",      "O",     "P",         "LeftBracket",  "RightBracket",  "Backslash" ,  "Kp7",        "Kp8",      "Kp9",         "KpMinus"      ],
     ["CapsLock" "A",        "S",     "D",     "F",     "G",     "H",     "J",     "K",      "L",     "Semicolon", "Quote",        "Enter",         "No" ,         "Kp4",        "Kp5",      "Kp6",         "KpPlus"       ],
     ["LShift",  "Backslash","Z",     "X",     "C",     "V",     "B",     "N",     "M",      "Comma", "Dot",       "Slash",        "RShift",        "Up",          "Kp1",        "Kp2",      "Kp3",         "KpEnter"      ],
     ["LCtrl",  "LGui",     "LAlt",   "No",    "No",    "Space", "Kp0",   "KpDot", "KpEnter","RAlt",  "RCtrl",     "Left",         "Down",          "Right",       "Delete",     "End",      "PageDown",    "ScrollLock"   ],
    ],
    
    [
     ["Escape",  "User0",    "User1", "User2", "User3", "User4", "User5",     "F7",    "F8",    "F9",    "F10",       "F11",          "F12",           "No" ,         "Insert",     "Home",     "PageUp",      "PrintScreen"  ],
     ["Grave",   "Kc1",      "Kc2",   "Kc3",   "Kc4",   "Kc5",   "Kc6",   "Kc7",   "Kc8",    "Kc9",   "Kc0" ,      "Minus",        "Equal",         "Backspace",   "NumLock",    "KpSlash",  "KpAsterisk",  "Pause"        ],
     ["Tab",     "Q",        "W",     "E",     "R",     "T",     "Y",     "U",     "I",      "O",     "P",         "LeftBracket",  "RightBracket",  "Backslash" ,  "Kp7",        "Kp8",      "Kp9",         "KpMinus"      ],
     ["CapsLock" "A",        "S",     "D",     "F",     "G",     "H",     "J",     "K",      "L",     "Semicolon", "Quote",        "Enter",         "No" ,         "Kp4",        "Kp5",      "Kp6",         "KpPlus"       ],
     ["LShift",  "Backslash","Z",     "X",     "C",     "V",     "B",     "N",     "M",      "Comma", "Dot",       "Slash",        "RShift",        "Up",          "Kp1",        "Kp2",      "Kp3",         "KpEnter"      ],
     ["LCtrl",  "LGui",     "LAlt",    "No",    "No",    "Space", "Kp0",   "KpDot", "KpEnter","RAlt",  "RCtrl",     "Left",         "Down",          "Right",       "Delete",     "End",      "PageDown",    "ScrollLock"   ], 
     ],
]

[ble]
enabled = true
battery_adc_pin = "vddh"

[light]
capslock = { pin = "P0_05", low_active = true }
scrolllock = { pin = "P0_00", low_active = true }
numslock= { pin = "P0_01", low_active = true }

[host]
vial_enabled = true
unlock_keys = [[0, 0], [0, 1]]

[aliases]
my_cut = "WM(X, LCtrl)"
my_copy = "WM(C, LCtrl)"
my_paste = "WM(V, LCtrl)"
